[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-economic-auditor"
version = "0.1.0"
description = "Research framework for comparing classical and quantum optimization on DeFi economics"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "sympy>=1.13",
  "networkx>=3.0",
  "pandas>=2.0",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.0",
  "matplotlib>=3.8",
  "pytest>=8.0",
  "GitPython>=3.0",
  "openai>=1.0",
  "pennylane>=0.37",
  "pennylane-lightning>=0.37",
  "torch>=2.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["dss", "audit-scratch", "olympus-v3"]
addopts = "-q"
